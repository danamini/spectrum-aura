<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" role="img" aria-label="Spectrum Aura animated spectrum bars">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060a"/>
      <stop offset="100%" stop-color="#0a1018"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#34d399" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="900" height="140" rx="12" fill="url(#bg)" stroke="#34d39933" stroke-width="1"/>
  <text x="24" y="34" fill="#ffffff99" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="3">SPECTRUM AURA</text>
  <text x="24" y="58" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1">LIVE AUDIO ’ MOTION + LIGHT + RHYTHM</text>
  <g filter="url(#glow)">
    <rect x="24" y="78" width="10" height="44" rx="2" fill="url(#bar)">
      <animate attributeName="height" values="18;44;26;40;18" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="104;78;96;82;104" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="40" y="88" width="10" height="34" rx="2" fill="url(#bar)">
      <animate attributeName="height" values="30;52;22;48;30" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="92;70;100;74;92" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="56" y="82" width="10" height="40" rx="2" fill="url(#bar)">
      <animate attributeName="height" values="24;56;34;50;24" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="98;66;88;72;98" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="72" y="90" width="10" height="32" rx="2" fill="url(#bar)">
      <animate attributeName="height" values="20;38;28;44;20" dur="0.95s" repeatCount="indefinite"/>
      <animate attributeName="y" values="102;84;94;78;102" dur="0.95s" repeatCount="indefinite"/>
    </rect>
    <rect x="88" y="76" width="10" height="46" rx="2" fill="url(#bar)">
      <animate attributeName="height" values="32;58;40;52;32" dur="1.25s" repeatCount="indefinite"/>
      <animate attributeName="y" values="90;64;82;70;90" dur="1.25s" repeatCount="indefinite"/>
    </rect>
    <rect x="104" y="84" width="10" height="38" rx="2" fill="url(#bar)">
      <animate attributeName="height" values="22;46;30;42;22" dur="1.35s" repeatCount="indefinite"/>
      <animate attributeName="y" values="100;76;92;80;100" dur="1.35s" repeatCount="indefinite"/>
    </rect>
    <rect x="120" y="80" width="10" height="42" rx="2" fill="url(#bar)">
      <animate attributeName="height" values="28;54;36;48;28" dur="1.05s" repeatCount="indefinite"/>
      <animate attributeName="y" values="94;68;86;74;94" dur="1.05s" repeatCount="indefinite"/>
    </rect>
    <rect x="136" y="86" width="10" height="36" rx="2" fill="url(#bar)">
      <animate attributeName="height" values="18;40;24;34;18" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="104;82;98;88;104" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="152" y="78" width="10" height="44" rx="2" fill="url(#bar)">
      <animate attributeName="height" values="26;50;32;46;26" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="96;72;90;76;96" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="168" y="92" width="10" height="30" rx="2" fill="url(#bar)">
      <animate attributeName="height" values="16;36;22;30;16" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="106;86;100;92;106" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="184" y="82" width="10" height="40" rx="2" fill="url(#bar)">
      <animate attributeName="height" values="24;48;34;42;24" dur="1.45s" repeatCount="indefinite"/>
      <animate attributeName="y" values="98;74;88;80;98" dur="1.45s" repeatCount="indefinite"/>
    </rect>
    <rect x="200" y="88" width="10" height="34" rx="2" fill="url(#bar)">
      <animate attributeName="height" values="20;44;28;38;20" dur="1.15s" repeatCount="indefinite"/>
      <animate attributeName="y" values="102;78;94;84;102" dur="1.15s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cx="860" cy="28" r="5" fill="#34d399">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="842" y="32" text-anchor="end" fill="#34d399cc" font-family="ui-monospace, monospace" font-size="10">LIVE</text>
</svg>
